name: Validate Huilima plugin composition

on:
  push:
    branches: ['codex/huilima-plugin-*']
    paths:
      - 'huilima_plugin/**'
      - 'app/**'
      - 'tests/**'
      - 'clients/**'
      - 'integrations/**'
      - 'preview/**'
      - '.github/workflows/huilima-plugin.yml'
  pull_request:
    paths:
      - 'huilima_plugin/**'
      - 'app/**'
      - 'tests/**'
      - 'clients/**'
      - 'integrations/**'
      - 'preview/**'
      - '.github/workflows/huilima-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huilima-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-composition:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install binary dependencies; PyExecJS is pure Python
        run: >-
          python -m pip install --only-binary=:all: --no-binary=PyExecJS
          -r requirements.txt -r integrations/feishu-bot/requirements.lock.txt
          pytest==8.4.2 wheel setuptools
      - name: Validate host and plugin contracts with isolated synthetic fixtures
        run: >-
          python -m pytest -q
          tests/test_huilima_plugin.py
          tests/test_wecom_readonly.py tests/test_wecom_customer_readonly.py
          tests/test_wecom_workflows.py tests/test_wecom_moments.py
          tests/test_integrations_v9.py tests/test_gap_closure_v10.py
          tests/test_business_workflows.py tests/test_feishu_drive.py
          tests/test_video_backup.py tests/test_hub_cli_workflows.py
          tests/test_operations_workflows.py tests/test_guide_site.py
      - name: Check existing CLI JSON contracts
        working-directory: clients/creatorhub-cli
        run: python -m unittest discover -s tests -q
      - name: Check model context, tool routing and exact confirmation without credentials
        working-directory: integrations/feishu-bot
        run: python -m unittest discover -q
      - name: Build independent Python plugin package, not a deployed release
        run: python -m pip wheel --no-build-isolation --no-deps ./huilima_plugin -w "$RUNNER_TEMP/huilima-wheel"
      - name: Validate preserved JavaScript behavior and syntax
        run: |
          node --version
          for script in huilima_plugin/web/*.js; do node --check "$script"; done
          node tests/web_wecom.cjs
          node tests/web_wecom_moments.cjs
          node tests/web_integrations_v9.cjs
          node tests/web_huilima_plugin.cjs
